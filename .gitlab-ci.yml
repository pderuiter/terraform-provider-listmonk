# Pipeline for terraform-provider-listmonk.
#
# Everything is built, tested and signed on our own runners; GitLab is the
# source of truth and Nexus holds the copy of record of every release. GitHub
# (pderuiter/terraform-provider-listmonk) is a mirror of the repository AND of
# the release artefacts, and exists only because the Terraform Registry
# ingests GitHub releases.
#
#   MR / main   lint (blocking), unit tests, docs drift, acceptance tests
#               against real listmonk releases, govulncheck/gosec/trivy.
#   main        mirror:github pushes main to GitHub; release:tag (toolkit)
#               tags vX.Y.Z from the Conventional Commits since the last tag.
#   tag vX.Y.Z  tests again, then
#                 build:release   GoReleaser, build only: zips, SHA256SUMS, manifest
#                 sign:gpg        SHA256SUMS.sig with the Registry signing key
#                 sign:cosign     <file>.sigstore.json with the estate cosign key
#                 publish:nexus   the signed set -> Nexus raw repo terraform-providers
#                 publish:github  those files, from Nexus, -> GitHub release -> Registry
#                 verify:registry `terraform init` from the Registry, signature checked
#
# Secrets (GPG key, GitHub token, Nexus publish account) and cosign transit
# signing come from Vault through the JWT role RELEASE_VAULT_ROLE, which Vault
# binds to this project's protected refs. See RELEASING.md.
include:
  - project: wbyc/infra/ci-cd-toolkit
    ref: $CI_CD_TOOLKIT_VERSION
    file:
      - /templates/common/stages.yml
      - /templates/ci/go.yml
      - /templates/common/release.yml
      - /templates/common/cosign.yml

# MR pipelines for MR branches, branch pipelines otherwise: one pipeline per
# push, not a duplicate branch + MR pair.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  APP_NAME: "terraform-provider-listmonk"
  GO_MAIN_PACKAGE: "."
  # base-go release (Go, golangci-lint, govulncheck). Its Go version must be
  # at least the toolchain line in go.mod: the job image's GOTOOLCHAIN=local
  # makes an older one fail instead of downloading another toolchain. Release
  # binaries embed the standard library, so this Go is what users run.
  BASE_GO_VERSION: "1.2.0"
  # Test matrix bounds, see test:acceptance.
  TF_VERSION_LATEST: "1.17.1"
  # Vault: JWT role of the release jobs (terragrunt-live prd/security/
  # vault-jwt-auth). Its own variable, like COSIGN_VAULT_ROLE: the wbyc group
  # variable VAULT_AUTH_ROLE would override a YAML VAULT_AUTH_ROLE.
  RELEASE_VAULT_ROLE: "gitlab-ci-terraform-registry"
  # KV v2 paths under secret/: gpg {private_key, passphrase}, github {token}.
  VAULT_SECRET_BASE: "wbyc/prd/infra/terraform-registry"
  # Nexus service account ci-publish {username, password} (prd/infra/nexus-security).
  VAULT_NEXUS_PATH: "prod/nexus/ci-publish"
  NEXUS_URL: "https://nexus.bsdserver.nl"
  # ALLOW_ONCE raw repository (prd/infra/nexus-repositories).
  NEXUS_RAW_REPO: "terraform-providers"
  GITHUB_REPOSITORY: "pderuiter/terraform-provider-listmonk"
  ALPINE_IMAGE: "${NEXUS_DOCKERHUB}/library/alpine:3.24.2"

# ==============================================================================
# Lint: blocking (the toolkit marks its lint jobs allow_failure).
# ==============================================================================

lint:golangci:
  allow_failure: false

lint:go-vet:
  allow_failure: false

lint:go-fmt:
  allow_failure: false

# docs/ is generated from the schemas, examples/ and templates/ and is what the
# Registry renders: an MR that changes a schema must regenerate it.
lint:docs:
  extends: .go_base
  stage: lint
  script:
    - export PATH="${CI_PROJECT_DIR}/.cache/bin:${PATH}"
    - TF_VERSION="${TF_VERSION_LATEST}" scripts/install-terraform.sh
    - terraform fmt -check -recursive -diff examples/
    - go generate ./...
    - |
      if [ -n "$(git status --porcelain -- docs/)" ]; then
        git status --porcelain -- docs/
        git diff -- docs/
        echo "ERROR: docs/ is out of date. Run 'make generate' and commit the result."
        exit 1
      fi
    - (cd tools && go tool tfplugindocs validate --provider-dir .. --provider-name listmonk)
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ==============================================================================
# Acceptance tests: the provider against real listmonk servers.
# ==============================================================================

# Every listmonk release in the matrix runs the full suite against a fresh
# instance (release binary from GitHub, checksum-verified) and PostgreSQL;
# the oldest and newest supported Terraform CLI bound the protocol side.
# Add a listmonk release here before claiming support for it in the docs.
test:acceptance:
  extends: .go_base
  stage: test
  services:
    - name: ${NEXUS_DOCKERHUB}/library/postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_USER: listmonk
    POSTGRES_PASSWORD: listmonk
    POSTGRES_DB: listmonk
    DB_HOST: postgres
    DB_PORT: "5432"
  parallel:
    matrix:
      - LISTMONK_VERSION: ["v5.1.0", "v6.2.0"]
        TF_VERSION: ["1.13.5", "1.17.1"]
  script:
    - export TF_ACC_TERRAFORM_PATH="$(scripts/install-terraform.sh)"
    - scripts/listmonk-test-server.sh
    - . ./.testacc.env
    - TF_ACC=1 go test ./internal/provider/ -v -count=1 -timeout 30m 2>&1 | tee test-output.txt
  after_script:
    - cat .cache/listmonk/*/listmonk.log 2>/dev/null | tail -100 || true
  artifacts:
    paths:
      - test-output.txt
    when: always
    expire_in: 14 days
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Not applicable to a provider: replaced by the jobs above and below.
test:integration:
  rules:
    - when: never

test:e2e:
  rules:
    - when: never

build:binary:
  rules:
    - when: never

publish:binaries:
  rules:
    - when: never

# ==============================================================================
# GitHub mirror and release.
# ==============================================================================

.release_vault:
  id_tokens:
    VAULT_ID_TOKEN:
      aud: "${CI_SERVER_URL}"
  interruptible: false
  # The Vault role only admits protected refs; don't start where it refuses.
  rules:
    - if: $CI_COMMIT_REF_PROTECTED != "true"
      when: never

# Release tags: vX.Y.Z or vX.Y.Z-<pre>. Pre-releases are published as GitHub
# pre-releases, which users only get by pinning the exact version.
.release_tag_rules:
  rules:
    - !reference [.release_vault, rules]
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/

# Push main to GitHub so the mirror always shows the code behind the next
# release. Fast-forward only: a commit made on GitHub fails this job.
mirror:github:
  extends: .release_vault
  stage: publish
  image: ${ALPINE_IMAGE}
  variables:
    GIT_DEPTH: "0"
    GIT_STRATEGY: clone
  needs:
    - job: test:unit
    - job: test:acceptance
  before_script:
    - apk add --no-cache git curl jq >/dev/null
  script:
    - . scripts/vault.sh
    - vault_login
    - export GITHUB_TOKEN="$(vault_kv "${VAULT_SECRET_BASE}/github" token)"
    - scripts/github-mirror.sh branch
  rules:
    - !reference [.release_vault, rules]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"

# GoReleaser in the standard Go image, build only (no signing, no publishing,
# no secrets). The manifest is copied into dist/ under its release name; the
# SHA256SUMS already covers it.
build:release:
  extends: .go_base
  stage: build
  needs:
    - job: test:unit
    - job: test:acceptance
  script:
    - go install "github.com/goreleaser/goreleaser/v2@${GORELEASER_VERSION}"
    - goreleaser release --clean --skip=publish
    - cp terraform-registry-manifest.json "dist/terraform-provider-listmonk_${CI_COMMIT_TAG#v}_manifest.json"
    - (cd dist && sha256sum -c terraform-provider-listmonk_*_SHA256SUMS)
  artifacts:
    paths:
      - dist/*.zip
      - dist/*_SHA256SUMS
      - dist/*_manifest.json
    expire_in: 30 days
  rules:
    - !reference [.release_tag_rules, rules]

sign:gpg:
  extends: .release_vault
  stage: build
  image: ${ALPINE_IMAGE}
  needs:
    - job: build:release
  script:
    - scripts/sign-gpg.sh
  artifacts:
    paths:
      - dist/*_SHA256SUMS.sig
    expire_in: 30 days
  rules:
    - !reference [.release_tag_rules, rules]

# Estate rule: every artefact we build is cosign-signed (transit key
# cosign-estate). Through the release role, which carries the transit policy
# for this project's protected TAGS (the shared signing role admits branches).
sign:cosign:
  extends: .cosign_sign_blob
  stage: build
  needs:
    - job: build:release
  variables:
    COSIGN_VAULT_ROLE: "${RELEASE_VAULT_ROLE}"
    COSIGN_BLOBS: "dist/*.zip dist/*_SHA256SUMS dist/*_manifest.json"
  interruptible: false
  rules:
    - if: $COSIGN_SIGNING_ENABLED == "false"
      when: never
    - !reference [.release_tag_rules, rules]

publish:nexus:
  extends: .release_vault
  stage: publish
  image: ${ALPINE_IMAGE}
  needs:
    - job: build:release
    - job: sign:gpg
    - job: sign:cosign
  script:
    - scripts/publish-nexus.sh
  rules:
    - !reference [.release_tag_rules, rules]

publish:github:
  extends: .release_vault
  stage: publish
  image: ${ALPINE_IMAGE}
  variables:
    GIT_DEPTH: "0"
    GIT_STRATEGY: clone
  needs:
    - job: publish:nexus
      artifacts: false
  script:
    - scripts/publish-github.sh
  rules:
    - !reference [.release_tag_rules, rules]

# The check a user's `terraform init` makes: the Registry lists the version,
# serves the zip, and the SHA256SUMS signature matches the key registered for
# the pderuiter namespace. Final releases only.
verify:registry:
  stage: verify
  image: ${ALPINE_IMAGE}
  needs:
    - job: publish:github
      artifacts: false
  before_script:
    - apk add --no-cache bash curl unzip >/dev/null
  script:
    - export TERRAFORM="$(TF_VERSION="${TF_VERSION_LATEST}" scripts/install-terraform.sh)"
    - VERSION="${CI_COMMIT_TAG#v}" scripts/verify-registry.sh
  # Registry ingestion is outside this pipeline's control (webhook, GitHub
  # outages); a failure here means "go look", not "the release is broken".
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
